{{ define "main" }}
  {{ $slug := .Data.Term }}
  {{ $meta := index hugo.Data.tags $slug }}
  <header class="page-header shell narrow">
    <h1>{{ with $meta }}{{ .label }}{{ else }}{{ .Title }}{{ end }}</h1>
  </header>
  <section class="shell narrow section-last">
    <div class="latest-list">
      {{ range .Pages.ByDate.Reverse }}
        {{ partial "post-card.html" . }}
      {{ end }}
    </div>
  </section>
{{ end }}
