{{ define "main" }}
  {{ $posts := (where site.RegularPages "Section" "posts").ByDate.Reverse }}
  <section class="home-posts shell narrow section-last">
    <header class="home-posts-header">
      <h1>最近文章</h1>
      <a class="text-link" href="{{ "posts/" | relURL }}">全部文章 →</a>
    </header>
    <div class="latest-list">
      {{ range first 10 $posts }}
        {{ partial "post-card.html" . }}
      {{ else }}
        <p class="empty-state">这里暂时还没有文章。</p>
      {{ end }}
    </div>
  </section>
{{ end }}
